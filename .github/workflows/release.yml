# Live-trial fixture, not an active workflow. Forge CI's hosted GitHub trial
# copies this file to .github/workflows/ of a disposable repository and puts
# the engine under test where this file names diggsweden/forge-ci.
#
# It is the reduced release Forge CI's GitHub orchestrator can express: the
# amd64 binary, one image, keyless signatures and a GitHub release. Archives,
# distribution packages and the second image stay with the Forgejo release.
name: Release Workflow

on:
  push:
    tags:
      - "release-request/v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: hanklankorg/fc-forge-ci/.github/workflows/release-orchestrator.yml@08fce3a6858c23a0acb2c6e39493002f14d32adb
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    # Only what this release uses: GPG signs the Git objects, RELEASE_TOKEN
    # pushes the release commit and creates the GitHub release.
    secrets:
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      branch: main
      forge-ci-binary-ref: v0.90.0-pre
      runtime-image: ghcr.io/hanklankorg/forge-ci-runtime-base:sha-08fce3a
      runtime-image-full: ghcr.io/hanklankorg/forge-ci-runtime:sha-08fce3a
      runtime-image-go: ghcr.io/hanklankorg/forge-ci-runtime-go-1.27:sha-08fce3a
      artifacts-config: test/live/github/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      release.attachartifacts: release-artifacts/*/gommitlint-*
      promote-staging-environment: ""
      promote-release-environment: ""
