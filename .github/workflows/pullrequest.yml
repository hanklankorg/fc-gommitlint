# Live-trial fixture, not an active workflow. Forge CI's hosted GitHub trial
# copies this file to .github/workflows/ of a disposable repository and puts
# the engine under test where this file names diggsweden/forge-ci.
name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: hanklankorg/fc-forge-ci/.github/workflows/pullrequest-orchestrator.yml@ab8dfb93b6ca383e903d49053b7a189ed9f0c3e7
    # No secrets: the gate's only one, CODE_SCANNING_TOKEN, is for SARIF upload.
    # The orchestrator's documented caller grant (docs/reference.md): a job
    # asking for more than its caller grants stops the run before it starts.
    permissions:
      contents: read
      actions: read
    with:
      forge-ci-binary-ref: v0.90.0-pre
      runtime-image: ghcr.io/hanklankorg/forge-ci-runtime-base:sha-ab8dfb9
      project-type: go
      lint-engine: nanolinter
      # The trial names a mirror of the Go flavour here.
      nanolinter-image: ghcr.io/hanklankorg/nanolinter:go@sha256:d3888d6baf33d695da5db6ce064590d671a0a22720c8589a0071a5bf32a43364

  # The tests stay the caller's, as in .forgejo/workflows/pullrequest.yml.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Race tests
        run: go list ./... | grep -v generated | xargs go test -count=1 -race -buildvcs=false
      - name: Vet tagged tiers
        run: |
          go vet -tags integration ./...
          go vet -tags blackbox ./...
