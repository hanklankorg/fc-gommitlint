version = 1

# Documentation files - CC0-1.0
[[annotations]]
path = ["**/*.md", "**/*.adoc"]
precedence = "override"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
  "docs/antora.yml",
  "**/go.sum",
  "renovate.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Configuration files - CC0-1.0
[[annotations]]
path = [
  ".chglog/*.tpl",
  "mise.lock",
  "schemas/gommitlint.schema.json",
  "scripts/testing/profiles.json",
  "packaging/release-platforms.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Locale/translation files - "CC0-1.0"
[[annotations]]
path = [
  "locale/**/*.po",
  "locale/**/*.pot",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Test data files - CC0-1.0
[[annotations]]
path = [
  "test/integration/testdata/keys/**",
  "**/testdata/fuzz/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Assets (images, diagrams) - CC0-1.0
[[annotations]]
path = [
  "assets/**/*.png",
  "assets/**/*.gif",
  "assets/**/*.svg",
  "docs/modules/ROOT/assets/images/**/*.png",
  "docs/modules/ROOT/assets/images/**/*.gif",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Go gopher logo — derivative of Renée French's mascot, CC-BY-3.0
[[annotations]]
path = [
  "assets/logo.png",
  "assets/apple-touch-icon.png",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "The Gommitlint Authors",
  "Renée French (original Go gopher character, CC-BY-3.0)",
]
SPDX-License-Identifier = "CC-BY-3.0"

# Hugo landing page — comment-less config and dotfiles
[[annotations]]
path = [
  "web/static/.domains",
  "web/static/robots.txt",
  "web/.gitignore",
  "web/.htmlvalidate.json",
  "web/.pa11yci.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"

# Atkinson Hyperlegible font files + its OFL licence text, distributed alongside
# the fonts as required by OFL-1.1 §2. Override: the licence text itself is
# full of the word "Copyright" and must not be read as this file's notice.
[[annotations]]
path = [
  "web/static/fonts/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

# Packaging and Debian files - CC0-1.0. Override: debian/copyright quotes
# whole licence texts, which must not be read as this file's own notice.
[[annotations]]
path = [
  "debian/control",
  "debian/copyright",
  "debian/source/format",
  "debian/changelog",
  "debian/watch",
  "debian/upstream/metadata",
  "debian/gbp.conf",
]
precedence = "override"
SPDX-FileCopyrightText = "The Gommitlint Authors"
SPDX-License-Identifier = "CC0-1.0"
